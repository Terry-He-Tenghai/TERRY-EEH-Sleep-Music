[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anphy-sleep-onset"
version = "0.1.0"
description = "Interpretable 16-channel EEG analysis of sleep-onset dynamics in ANPHY-Sleep"
requires-python = ">=3.10"
dependencies = [
  "h5py",
  "joblib",
  "matplotlib",
  "mne",
  "numpy",
  "pandas",
  "pyarrow",
  "pygame-ce>=2.5.8",
  "pyserial>=3.5",
  "pyyaml",
  "requests>=2.34.2",
  "scikit-learn==1.7.2",  # Version used to serialize the legacy DEMO joblib models.
  "scipy",
  "seaborn",
  "soundfile>=0.14.0",
  "statsmodels",
  "yasa==0.7.0",
]

[project.optional-dependencies]
waveform = [
  "torch==2.6.0",
  "numpy==2.2.6",
  "scipy==1.15.3",
]
music = [
  "python-vlc",
  "pygame",
]
hardware = [
  "brainflow>=5.18.1",
]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
anphy-sleep = "anphy_sleep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
